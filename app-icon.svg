<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- OmmWriter-inspired Serene Atmospheric Zen Gradients -->
    <!-- Soft, peaceful mist-dawn paper background -->
    <linearGradient id="zenBg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>

    <!-- Subtle Ambient Inner Border -->
    <linearGradient id="zenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Calligraphy Ink Feather Gradient -->
    <linearGradient id="inkGrad" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Calming Aurora Dawn Accent (OmmWriter Gaia spirit) -->
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Luminous Zen Droplet Accent -->
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Soft Diffuse Shadows -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <filter id="featherShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- 1. Apple macOS Squircle Canvas Base -->
  <rect x="80" y="80" width="864" height="864" rx="196" ry="196" fill="url(#zenBg)" filter="url(#squircleShadow)"/>
  <rect x="81" y="81" width="862" height="862" rx="195" ry="195" fill="none" stroke="url(#zenBorder)" stroke-width="2"/>

  <!-- 2. Atmospheric Ambient Light (Subtle circular aura behind feather) -->
  <circle cx="512" cy="512" r="320" fill="url(#auroraGlow)"/>

  <!-- 3. Minimalist Zen Floating Feather & Quill Emblem -->
  <g filter="url(#featherShadow)">
    <!-- Right Upper Feather Barb (Flowing, weightless organic curve) -->
    <path d="M 518 200 
             C 610 230, 690 320, 690 440 
             C 690 510, 650 580, 590 630 
             C 566 610, 545 565, 542 525 
             C 575 510, 600 465, 600 420 
             C 600 345, 550 280, 518 200 Z" 
          fill="url(#inkGrad)"/>

    <!-- Left Upper Feather Barb (Delicate balanced curvature) -->
    <path d="M 512 200 
             C 420 250, 350 350, 350 470 
             C 350 540, 385 605, 440 655 
             C 455 630, 470 585, 474 540 
             C 445 520, 424 475, 424 430 
             C 424 350, 476 270, 512 200 Z" 
          fill="url(#inkGrad)"/>

    <!-- Mid Feather Flume (Secondary organic feather vane) -->
    <path d="M 536 490 
             C 575 530, 610 590, 605 650 
             C 575 665, 545 640, 532 605 Z" 
          fill="url(#inkGrad)" opacity="0.9"/>

    <path d="M 480 500 
             C 440 545, 410 605, 418 665 
             C 448 675, 476 650, 486 615 Z" 
          fill="url(#inkGrad)" opacity="0.9"/>

    <!-- Central Spine (Rachis) transitioning into Calligraphy Pen Nib -->
    <!-- The central graceful shaft -->
    <path d="M 514 200 
             C 517 380, 515 540, 512 670 
             L 512 760 
             L 508 760 
             L 508 670 
             C 505 540, 507 380, 510 200 Z" 
          fill="#0f172a"/>

    <!-- Calligraphy Pen Nib Base & Tip (The grounding of writing) -->
    <path d="M 490 670 
             C 490 670, 480 730, 472 755 
             C 470 762, 475 770, 483 770 
             L 507 770 
             L 510 820 
             L 514 820 
             L 517 770 
             L 541 770 
             C 549 770, 554 762, 552 755 
             C 544 730, 534 670, 534 670 Z" 
          fill="url(#inkGrad)"/>

    <!-- Nib Breather Hole & Center Slit -->
    <circle cx="512" cy="740" r="7" fill="#f8fafc"/>
    <line x1="512" y1="747" x2="512" y2="820" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>

    <!-- 4. The Zen Ink Droplet (OmmWriter's meditative serenity drop) -->
    <circle cx="512" cy="855" r="10" fill="url(#dropGrad)"/>
    <circle cx="510" cy="853" r="3" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
