<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="50%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>

    <!-- Subtle Inner Glow / Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5268" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2a303f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#181c26" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Accent Gradient: Typomm Emerald & Cyan -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>

    <!-- Header / T-Bar Gradient -->
    <linearGradient id="tBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0d7de"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="glyphGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00f5a0" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- macOS App Squircle Base (1024x1024 canvas, 864x864 squircle) -->
  <rect x="80" y="80" width="864" height="864" rx="196" ry="196" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
  <rect x="81" y="81" width="862" height="862" rx="195" ry="195" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="512" cy="512" r="280" fill="url(#accentGrad)" opacity="0.08"/>

  <!-- Modern Stylized T & Pen Nib Monogram -->
  <g filter="url(#glyphGlow)">
    <!-- T Horizontal Top Bar (Clean, rounded, architectural) -->
    <rect x="256" y="270" width="512" height="68" rx="34" ry="34" fill="url(#tBarGrad)"/>

    <!-- Left Wing of Monogram 'M' (Subtle architectural geometric fold) -->
    <path d="M 276 430 L 396 660 L 396 740 L 276 510 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Right Wing of Monogram 'M' -->
    <path d="M 748 430 L 628 660 L 628 740 L 748 510 Z" fill="#ffffff" opacity="0.15"/>

    <!-- Center T-Stem transitioning into Fountain Pen Nib -->
    <!-- Upper vertical stem of T -->
    <path d="M 466 338 L 558 338 L 558 480 L 466 480 Z" fill="url(#tBarGrad)"/>

    <!-- Pen Nib Body (Descending from T to sharp nib tip) -->
    <path d="M 454 480 
             L 570 480 
             L 600 600 
             L 512 770 
             L 424 600 Z" 
          fill="url(#accentGrad)"/>

    <!-- Pen Nib Slit & Breather Hole -->
    <circle cx="512" cy="580" r="16" fill="#141720"/>
    <line x1="512" y1="596" x2="512" y2="764" stroke="#141720" stroke-width="7" stroke-linecap="round"/>

    <!-- Minimalist Markdown Indicator (Corner Accent dot) -->
    <circle cx="704" cy="304" r="10" fill="url(#accentGrad)"/>
  </g>
</svg>
